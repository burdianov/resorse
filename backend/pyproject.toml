[project]
name = "resors-backend"
version = "0.1.0"
description = "Domain-neutral enterprise foundation — API"
requires-python = ">=3.14"
dependencies = [
    # Core
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    # .env reading for Settings *and* the bootstrap CLI, which reads its
    # one-time credentials itself so they never load into the API process
    # (DECISIONS C15).
    "python-dotenv==1.2.4",
    # Persistence (used from F023 onward)
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    # Auth and request handling (no JWT: sessions are opaque cookies — DECISIONS C12)
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "argon2-cffi==25.1.0",
    # Outbound HTTP (F052): the Gotenberg conversion adapter is the first caller,
    # and it was previously a *dev* dependency only because nothing in the app
    # made a request of its own. `httpx` is the same client the test suite uses,
    # so the adapter and its tests speak one library.
    "httpx==0.28.1",
    # Generic document, report and export infrastructure (F049–F053)
    "reportlab==5.0.1",
    "pypdf==6.19.0",
    "pymupdf==1.28.2",
    # `docxtpl` renders a DOCX template with Jinja; `python-docx` is what builds
    # the template it renders. docxtpl depends on it already, but F052 imports it
    # by name, and a direct import of an undeclared transitive dependency is a
    # break waiting for someone else's release (F052).
    "docxtpl==0.20.2",
    "python-docx==1.2.0",
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # Declared directly, not leaned on as pytest-cov's transitive dependency:
    # `scripts/coverage_gate.py` imports `coverage` by name to read the group
    # numbers, and F052 already settled that a direct import of an undeclared
    # transitive dependency is a break waiting for someone else's release.
    # Pinned to the version pytest-cov already resolved, so the lock does not move.
    "coverage==7.16.2",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = ["-ra", "--strict-markers"]
markers = [
    # A test that needs the real PostgreSQL database — directly, or through a
    # fixture that needs it. The two legs of the backend gate are selected by
    # this marker (F056): `-m "not integration"` runs anywhere with no
    # database, `-m integration` is the PostgreSQL leg. `tests/test_markers.py`
    # fails if a database-backed test forgets it, and the conftest fails
    # rather than skips when the integration leg has no database — a suite
    # that reports success with every database test skipped is not a gate.
    "integration: needs a reachable PostgreSQL database (see tests/conftest.py)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
# **Applied revisions are frozen.** `migrations/versions/0009_file_assets.py`
# is the file ruff would rewrap, and CARRIED_CONSTRAINTS §9 is categorical:
# "never edit a migration that has been applied; add the next one" — a
# revision applied in two environments must stay byte-identical, so the
# formatter does not own it. This is the frontend's `src/lib/generated/`
# exclusion (F055) in its backend form: a generator owns that tree, history
# owns this one. `ruff check` still lints the whole migration tree, and a new
# revision is formatted at creation time, before it is ever applied.
exclude = ["migrations/versions/*.py"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Thresholds are **not** here: `scripts/coverage_gate.py` owns them, because
# coverage.py enforces one global number and BP §10.5 asks for two (the core
# and the auth/RBAC branches) plus a ratchet. See DECISIONS C44.
show_missing = true
precision = 2

[tool.mypy]
python_version = "3.14"
strict = true
# The whole backend, not just the app: the test tree is where an unused
# `type: ignore` or a call with too few arguments survives unnoticed (F056
# found 16 of the first and 2 of the second). `uv run mypy` with no arguments
# checks exactly this list, so the gate command and the config cannot drift.
files = ["app", "tests", "scripts"]

# Two of the report libraries publish no type information at all, so `strict`
# would report *their* untyped imports as this project's errors: ReportLab
# (F051) and docxtpl (F052). The exemption is scoped to those two packages, and
# each entry is a fact about the released package rather than a preference —
# `pypdf` and `python-docx` ship inline types and stay fully checked.
[[tool.mypy.overrides]]
module = ["reportlab.*", "docxtpl.*"]
ignore_missing_imports = true
