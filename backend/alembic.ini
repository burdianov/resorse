# Alembic configuration (F023).
#
# The database URL is deliberately NOT written here: this file is committed,
# and a URL carries a password. `migrations/env.py` builds the engine from
# `app.core.database.get_engine()`, which reads DATABASE_URL from the
# environment (backend/.env in development) — one source of truth, and no
# credential in the repository.

[alembic]
script_location = migrations
# So `app` is importable when Alembic runs from the backend directory.
prepend_sys_path = .
# Revision files are named `<rev>_<slug>.py`; revisions are hand-numbered
# (`--rev-id 0002`) so the chain reads in order in a directory listing.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
